<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
</head>
            <form action="/enviar" method="post">
                <h2>Registrarse</h2>
                <p>
                    <label for="Nombre" style="display: inline-block; width: 60px;">Nombre: </label>
                    <input type="text" id="Nombre" name="Nombre" required>
                </p>

                <p>
                    <label for="Apellido" style="display: inline-block; width: 60px;">Apellido: </label>
                    <input type="text" id="Apellido" name="Apellido" required>
                </p>

                <p>
                    <label for="Email" style="display: inline-block; width: 60px;">Email: </label>
                    <input type="email" id="Email" name="Email" required>
                </p>

                <p>
                    <label for="Celular" style="display: inline-block; width: 60px;">Celular: </label>
                    <input type="text" id="Celular" name="Celular" required>
                </p>
                <button type="submit">Enviar</button>
            </form>
</html>
