<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Ciudad Dadiuc</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="pagina-ciudad">

    <!-- Header Sticky con Navbar Bootstrap -->
    <header class="header-ciudad sticky-top">
        <div class="container text-center py-2">
            <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
                <div class="container-fluid">
                    <a class="navbar-brand logo-dadiuc text-uppercase m-0" href="index.html"
                        style="display:flex; gap:30px;">
                        <img src="Imagenes/LogoGrupoBlanco.png" alt="Logo de la ciudad Daduic" class="logo-daduic">
                        REGISTRARSE
                    </a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#menuRegistro" aria-controls="menuRegistro" aria-expanded="false"
                        aria-label="Abrir navegación">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse justify-content-end" id="menuRegistro">
                        <ul class="navbar-nav gap-lg-2">
                            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="ciudad.html">Ciudad</a></li>
                            <li class="nav-item"><a class="nav-link" href="lugares.html">Lugares</a></li>
                            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container my-5 contenido-principal">
        <section class="seccion-ciudad p-4 rounded max-w-600 mx-auto">
            <h2 class="titulo-registro text-center mb-4">Registrarse</h2>

            <form action="#" method="post" class="formulario-contacto">
                <div>
                    <label for="Nombre">Nombre:</label>
                    <input type="text" id="Nombre" name="Nombre" required>
                </div>

                <div>
                    <label for="Apellido">Apellido:</label>
                    <input type="text" id="Apellido" name="Apellido" required>
                </div>

                <div>
                    <label for="Email">Email:</label>
                    <input type="email" id="Email" name="Email" required>
                </div>

                <div>
                    <label for="Celular">Celular:</label>
                    <input type="tel" id="Celular" name="Celular" required>
                </div>

                <button type="submit" class="btn-enviar mt-3">Enviar Registro</button>
            </form>
        </section>
    </main>

    <footer class="pie-pagina text-center py-4">
        <div class="container">
            <p class="m-0">© 2026 Ciudad Dadiuc - Sitio Oficial de la Oficina de Turismo.</p>
        </div>
    </footer>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
