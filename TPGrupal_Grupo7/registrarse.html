<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel=stylesheet href=css/estilos.css>

    <title>Registrarse</title>

<body class="body">
    <!--En la cabecera superior agrego las pestañas para poder desplazarse en las demas secciones de la pagina-->

    <div class="header-superior">
        <nav>
            <ul class="menu-pestañas">
                <li><a href="index.html" style="color: rgb(255, 255, 255);">Inicio</a></li>
                <li><a href="Ciudad.html" style="color: rgb(255, 255, 255);">Ciudad</a></li>
                <li><a href="lugares.html" style="color: rgb(255, 255, 255);">Lugares</a></li>
                <li><a href="Contacto.html" style="color: rgb(255, 255, 255);">Contacto</a></li>
            </ul>
        </nav>
    </div>

    </head>
    <h2 style="font-size: 50px;
    font-family: 'Oswald-Bold', sans-serif;
    text-decoration-line: none;
    font-size: 30px;
    color: rgb(255, 255, 255);
    padding: 0px 30px;
    text-align: center;">
        Registrarse</h2>
    <div class="formulario-registro">
        <form action="/enviar" method="post">

            <p>
                <label for="Nombre" style="display: inline-block; width: 100px; height: 30px;text-shadow: 0px 4px 15px rgba(87, 86, 86, 0.8)">Nombre: </label>
                <input type="text" id="Nombre" name="Nombre" required>
            </p>

            <p>
                <label for="Apellido" style="display: inline-block; width: 100px; height: 30px;text-shadow: 0px 4px 15px rgba(87, 86, 86, 0.8)">Apellido: </label>
                <input type="text" id="Apellido" name="Apellido" required>
            </p>

            <p>
                <label for="Email" style="display: inline-block; width: 100px; height: 30px;    text-shadow: 0px 4px 15px rgba(87, 86, 86, 0.8)   ">Email: </label>
                <input type="email" id="Email" name="Email" required>
            </p>

            <p>
                <label for="Celular" style="display: inline-block; width: 100px; height: 500px;text-shadow: 0px 4px 15px rgba(87, 86, 86, 0.8)">Celular: </label>
                <input type="text" id="Celular" name="Celular" required>
            </p>
            <button type="submit">Enviar</button>
        </form>
    </div>
</body>

</html>
